name: Tests

# Runs the unit test suite (Python: `test` job) and the dashboard's test
# suite (`dashboard-test`) on every push/PR to main. Deliberately does NOT
# need ANTHROPIC_API_KEY -- every test exercises pure logic (filters, the
# tolerant parsers, mocked-API dashboard views) against synthetic inputs,
# never a live API call. The golden eval against the real Fact-Checker judge
# is a SEPARATE, manually-triggered workflow (golden-eval.yml) because it
# costs real money and shouldn't run on every push.
#
# `test` DOES run a real Postgres service so tests/test_persist_integration.py
# and tests/test_api_endpoints.py actually run here instead of skipping --
# those are the only files that touch the DB, and skipping them in CI would
# mean nothing ever exercised that code path outside a developer's own
# machine. `dashboard-test` runs independently (no Postgres needed -- every
# ../api call is mocked) and in parallel with `test`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: modelscout
          POSTGRES_PASSWORD: modelscout_dev_only
          POSTGRES_DB: modelscout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modelscout -d modelscout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://modelscout:modelscout_dev_only@localhost:5432/modelscout

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # torch's CPU wheels live on a separate index; --extra-index-url lets
      # pip resolve requirements.txt's pinned "torch==...+cpu" line from
      # there while everything else still resolves from PyPI as normal.
      - name: Install dependencies
        run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint (ruff)
        run: ruff check .

      - name: Apply schema
        run: PGPASSWORD=modelscout_dev_only psql -h localhost -U modelscout -d modelscout -f db/schema.sql

      - name: Run tests
        run: pytest tests/ -v

  dashboard-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Type-check + build
        working-directory: dashboard
        run: npm run build

      - name: Run tests
        working-directory: dashboard
        run: npm test
