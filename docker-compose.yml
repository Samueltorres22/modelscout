services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: modelscout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: modelscout
      POSTGRES_PASSWORD: modelscout_dev_only
      POSTGRES_DB: modelscout
    ports:
      - "5433:5432"
    volumes:
      - modelscout_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelscout -d modelscout"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  modelscout_pgdata:
